networks:
  fraud-network:
    driver: bridge

services:
  # ==========================================
  # KHỐI 1: KAFKA CLUSTER (3 Brokers + 1 ZK)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    networks:
      - fraud-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 1G }

  kafka1:
    image: confluentinc/cp-kafka:7.3.0
    depends_on: [zookeeper]
    networks:
      - fraud-network
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 3 # <-- THÊM DÒNG NÀY
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 1G }

  kafka2:
    image: confluentinc/cp-kafka:7.3.0
    depends_on: [zookeeper]
    networks:
      - fraud-network
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
      KAFKA_NUM_PARTITIONS: 3 # <-- THÊM DÒNG NÀY
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 1G }

  kafka3:
    image: confluentinc/cp-kafka:7.3.0
    depends_on: [zookeeper]
    networks:
      - fraud-network
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
      KAFKA_NUM_PARTITIONS: 3 # <-- THÊM DÒNG NÀY
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 1G }

 # ==========================================
  # KHỐI 2: SPARK CLUSTER (1 Master, 2 Workers) - Bản chính chủ Apache
  # ==========================================
  spark-master:
    image: apache/spark:3.4.1
    networks:
      - fraud-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    ports:
      - "8080:8080" # Xem dashboard Spark
      - "7077:7077" # Cổng kết nối nội bộ cho Worker
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 2G }

  spark-worker-1:
    image: apache/spark:3.4.1
    depends_on: [spark-master]
    networks:
      - fraud-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 4G }

  spark-worker-2:
    image: apache/spark:3.4.1
    depends_on: [spark-master]
    networks:
      - fraud-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 4G }

  # ==========================================
  # KHỐI 3: FLINK CLUSTER (1 JobManager, 2 TaskManagers)
  # ==========================================
  flink-jobmanager:
    # image: flink:1.17.1-scala_2.12
    build: ./flink-cluster
    networks:
      - fraud-network
    command: jobmanager
    ports:
      - "8081:8081" # Xem dashboard Flink
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 2G }

  flink-taskmanager-1:
    # image: flink:1.17.1-scala_2.12
    build: ./flink-cluster
    depends_on: [flink-jobmanager]
    networks:
      - fraud-network
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 4G }

  flink-taskmanager-2:
    # image: flink:1.17.1-scala_2.12
    build: ./flink-cluster
    depends_on: [flink-jobmanager]
    networks:
      - fraud-network
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 4G }

  # ==========================================
  # KHỐI 4: ỨNG DỤNG CỦA EM (Client Nodes)
  # ==========================================
  data-generator:
    build: ./data-generator
    networks:
      - fraud-network
    depends_on: [kafka1, kafka2, kafka3]
    volumes:
      - ./data:/app/data:ro 
    environment:
      # TRỎ VÀO CẢ 3 BROKER KAFKA
      - KAFKA_BROKERS=kafka1:9092,kafka2:9092,kafka3:9092
      - TOPIC_NAME=raw_transactions
      - DATA_FILE=/app/data/fraudTrain.csv
      - ENV=benchmark # Chế độ siêu tốc
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }
        
  # Sửa lại spark-batch thành node chỉ làm nhiệm vụ ném Job (Driver)
  spark-driver:
    build: ./spark-jobs
    networks:
      - fraud-network
    depends_on: [spark-master, kafka1]
    volumes:
      - ./application_default_credentials.json:/app/application_default_credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/application_default_credentials.json
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 2G }

  flink-driver:
    build: ./flink-jobs
    networks:
      - fraud-network
    depends_on: [flink-jobmanager, kafka1]
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 2G }

  bq-sink:
    build: ./bq-sink
    networks:
      - fraud-network
    depends_on: [kafka1]
    volumes:
      - ./application_default_credentials.json:/app/application_default_credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/application_default_credentials.json
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 1G }