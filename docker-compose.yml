version: '3.8'

services:
  # 1. Khối Zookeeper (Bắt buộc phải có để quản lý Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # 2. Khối Kafka Broker (Nơi hứng dữ liệu từ Data Generator)
  kafka1:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 3. Khối Data Generator (Trình sinh dữ liệu giả lập của em)
  data-generator:
    build: ./data-generator
    depends_on:
      - kafka1
    volumes:
      # Map thư mục data chứa file fraudTrain.csv vào container
      - ./data:/app/data:ro  
      # Map file khóa JSON theo đúng tên em đang để
      - ./application_default_credentials.json:/app/application_default_credentials.json:ro 
    environment:
      # Các biến môi trường cho config.py nhận diện
      - KAFKA_BROKERS=kafka1:9092
      - TOPIC_NAME=raw_transactions
      # Chỉ đích danh file dữ liệu theo tên chuẩn trong cây thư mục
      - DATA_FILE=/app/data/fraudTrain.csv
      # Chỉ đích danh chìa khóa Google
      - GOOGLE_APPLICATION_CREDENTIALS=/app/application_default_credentials.json