version: '3.8'

networks:
  fraud-network:
    driver: bridge

services:
  # 1. Khối Zookeeper (Bắt buộc phải có để quản lý Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    networks:
      - fraud-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # 2. Khối Kafka Broker (Nơi hứng dữ liệu từ Data Generator)
  kafka1:
    image: confluentinc/cp-kafka:7.3.0
    networks:
      - fraud-network
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 3. Khối Data Generator (Trình sinh dữ liệu siêu tốc độ)
  data-generator:
    build: ./data-generator
    networks:
      - fraud-network
    depends_on:
      - kafka1
    volumes:
      - ./data:/app/data:ro  
      - ./application_default_credentials.json:/app/application_default_credentials.json:ro 
    environment:
      - KAFKA_BROKERS=kafka1:9092
      - TOPIC_NAME=raw_transactions
      - DATA_FILE=/app/data/fraudTrain.csv
      - GOOGLE_APPLICATION_CREDENTIALS=/app/application_default_credentials.json
      # Biến quy định tốc độ bắn. Đổi thành 'cloud' nếu đẩy lên máy ảo GCE!
      - ENV=local 
  
  # 4. Khối xử lý dòng dữ liệu liên tục bằng Apache Spark
  spark-batch:
    build: ./spark-jobs
    networks:
      - fraud-network
    depends_on:
      - kafka1
    volumes:
      - ./application_default_credentials.json:/app/application_default_credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/application_default_credentials.json