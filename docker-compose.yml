networks:
  fraud-network:
    driver: bridge

services:
  # ==========================================
  # KHỐI 1: KAFKA CLUSTER (3 Brokers + 1 ZK)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    networks:
      - fraud-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 4000              # 👈 Tăng thời gian 1 nhịp đập lên 4 giây (Mặc định là 2s)
      ZOOKEEPER_MAX_SESSION_TIMEOUT: 60000   # 👈 Cho phép các session chịu đựng lag lên tới 60 giây
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 1G }

  kafka1:
    image: confluentinc/cp-kafka:7.3.0
    depends_on: [zookeeper]
    networks:
      - fraud-network
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 3
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 2G }

  kafka2:
    image: confluentinc/cp-kafka:7.3.0
    depends_on: [zookeeper]
    networks:
      - fraud-network
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
      KAFKA_NUM_PARTITIONS: 3
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 2G }

  kafka3:
    image: confluentinc/cp-kafka:7.3.0
    depends_on: [zookeeper]
    networks:
      - fraud-network
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
      KAFKA_NUM_PARTITIONS: 3
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 2G }

  kafka-setup:
    image: confluentinc/cp-kafka:7.3.0
    networks:
      - fraud-network
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    command: >
      bash -c "
        echo '⏳ Đang chờ ĐỦ 3 BROKERS của Kafka Cluster sẵn sàng...'
        cub kafka-ready -b kafka1:9092 3 60 
        
        echo '🛠️ Cả cụm Kafka đã lên! Đang tạo các Topic rỗng...'
        kafka-topics --create --if-not-exists --topic raw_transactions --bootstrap-server kafka1:9092 --partitions 3 --replication-factor 2
        kafka-topics --create --if-not-exists --topic fraud_alerts --bootstrap-server kafka1:9092 --partitions 3 --replication-factor 2
        echo '✅ Xong! Thợ xây rút lui.'
      "

  # ==========================================
  # KHỐI 2: SPARK CLUSTER (1 Master, 2 Workers)
  # ==========================================
  spark-master:
    image: apache/spark:3.4.1
    networks:
      - fraud-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 2G }

  spark-worker-1:
    image: apache/spark:3.4.1
    depends_on: [spark-master]
    networks:
      - fraud-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      resources:
        limits: 
          cpus: '${SPARK_WORKER_CPU:-2.0}'
          memory: '${SPARK_WORKER_MEM:-4G}'

  spark-worker-2:
    image: apache/spark:3.4.1
    depends_on: [spark-master]
    networks:
      - fraud-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      resources:
        limits: 
          cpus: '${SPARK_WORKER_CPU:-2.0}'
          memory: '${SPARK_WORKER_MEM:-4G}'

  # ==========================================
  # KHỐI 3: FLINK CLUSTER (1 JobManager, 2 TaskManagers)
  # ==========================================
  flink-jobmanager:
    build: ./flink-cluster
    networks:
      - fraud-network
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 2G }

  flink-taskmanager-1:
    build: ./flink-cluster
    depends_on: [flink-jobmanager]
    networks:
      - fraud-network
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    deploy:
      resources:
        limits: 
          cpus: '${FLINK_TM_CPU:-2.0}'
          memory: '${FLINK_TM_MEM:-4G}'

  flink-taskmanager-2:
    build: ./flink-cluster
    depends_on: [flink-jobmanager]
    networks:
      - fraud-network
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    deploy:
      resources:
        limits: 
          cpus: '${FLINK_TM_CPU:-2.0}'
          memory: '${FLINK_TM_MEM:-4G}'

  # ==========================================
  # KHỐI 4: ỨNG DỤNG CỦA EM (Client Nodes)
  # ==========================================
  data-generator:
    build: ./data-generator
    networks:
      - fraud-network
    depends_on: [kafka1, kafka2, kafka3]
    volumes:
      - ./data:/app/data:ro 
    environment:
      - KAFKA_BROKERS=kafka1:9092,kafka2:9092,kafka3:9092
      - TOPIC_NAME=raw_transactions
      - DATA_FILE=/app/data/fraudTrain.csv
      - ENV=${APP_ENV:-local}
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 2G }
        
  spark-driver:
    build: ./spark-jobs
    networks:
      - fraud-network
    depends_on: [spark-master, kafka1]
    volumes:
      - ./application_default_credentials.json:/app/application_default_credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/application_default_credentials.json
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 4G }

  flink-driver:
    build: ./flink-jobs
    networks:
      - fraud-network
    depends_on: [flink-jobmanager, kafka1]
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 6G }

  bq-sink:
    build: ./bq-sink
    networks:
      - fraud-network
    depends_on: [kafka1]
    volumes:
      - ./application_default_credentials.json:/app/application_default_credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/application_default_credentials.json
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 2G }

  # ==========================================
  # KHỐI 5: DASHBOARD MONITORING
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    networks:
      - fraud-network
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=grafana-bigquery-datasource
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 1G }

  model-api:
    build: ./model-api
    networks:
      - fraud-network
    ports:
      - "8000:8000"
    volumes:
      # Ánh xạ thư mục chứa models từ máy vật lý vào container
      - ./model-api/models:/app/models
    environment:
      # Truyền API Key từ file môi trường .env cục bộ tránh lộ thông tin
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 4G }

  grafana-simulator:
    build: ./simulator
    container_name: big-data-grafana-simulator
    networks:
      - fraud-network
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits: { cpus: '0.2', memory: '128M' } # Cực kỳ nhẹ, tốn rất ít RAM